<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Financas da Familia</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { font-family: Segoe UI, Tahoma, Geneva, Verdana, sans-serif; }
    .scrollbar-thin::-webkit-scrollbar { width: 6px; }
    .scrollbar-thin::-webkit-scrollbar-track { background: #f1f5f9; }
    .scrollbar-thin::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 3px; }
    @media print { .no-print { display: none !important; } }
  </style>
</head>
<body class="bg-slate-100 min-h-screen">
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useCallback, useMemo } = React;
const fmt = (v) => new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(v || 0);
const parseNum = (s) => { const n = parseFloat(String(s).replace(',', '.')); return isNaN(n) ? 0 : n; };
const uid = () => Math.random().toString(36).slice(2, 9);

const DEFAULT_DATA = {
  salarios: { nicolas: 9733.06, ana: 4238.53, valeAlimentacao: 810.00, emprestimosDescontados: 1200.00 },
  fixo: [
    { id: uid(), desc: 'Luz (PIX)', valor: 357.00, tipo: 'pix' },
    { id: uid(), desc: 'Escolinha CC dia 5', valor: 1670.00, tipo: 'cartao' },
    { id: uid(), desc: 'Refeicoes Escolinha', valor: 400.00, tipo: 'pix' },
    { id: uid(), desc: 'Mensalidade Clube', valor: 215.00, tipo: 'pix' },
    { id: uid(), desc: 'Cecilia Lazer PIX', valor: 207.25, tipo: 'pix' },
    { id: uid(), desc: 'Ana Lazer PIX', valor: 200.00, tipo: 'pix' },
    { id: uid(), desc: 'Nicolas Lazer Cartao', valor: 200.00, tipo: 'cartao' },
    { id: uid(), desc: 'Investir (Transferir)', valor: 1000.00, tipo: 'pix' },
    { id: uid(), desc: 'TLP', valor: 80.00, tipo: 'pix' },
  ],
  obrigatorio: [
    { id: uid(), desc: 'Mercado', valor: 2980.00, tipo: 'cartao' },
    { id: uid(), desc: 'Farmacia', valor: 800.00, tipo: 'cartao' },
    { id: uid(), desc: 'Uber / Gasolina', valor: 700.00, tipo: 'cartao' },
  ],
  extras: [
    { id: uid(), desc: 'Nicolas Lazer Cartao', valor: 1000.00, tipo: 'cartao' },
    { id: uid(), desc: 'Ana Lazer Cartao', valor: 1300.00, tipo: 'cartao' },
    { id: uid(), desc: 'Cecilia Lazer Cartao', valor: 592.75, tipo: 'cartao' },
    { id: uid(), desc: 'Familia Lazer Cartao', valor: 810.00, tipo: 'cartao' },
  ],
  assinaturas: [
    { id: uid(), desc: 'Tv PTV', valor: 30.00 },
    { id: uid(), desc: 'Spotify', valor: 31.90 },
    { id: uid(), desc: 'Amazon Prime', valor: 19.90 },
    { id: uid(), desc: 'Netflix', valor: 20.90 },
    { id: uid(), desc: 'Livrinhos Cecilia', valor: 55.00 },
    { id: uid(), desc: 'Net Casa', valor: 90.00 },
    { id: uid(), desc: 'TecConcursos', valor: 36.00 },
  ],
  parceladas: [
    { id: uid(), desc: 'Espada', valor: 129.17, terminaEm: '2026-11', tipo: 'cartao' },
    { id: uid(), desc: 'Curso Augustus', valor: 33.63, terminaEm: '2026-11', tipo: 'cartao' },
    { id: uid(), desc: 'Relogio Garmin', valor: 97.49, terminaEm: '2027-02', tipo: 'cartao' },
    { id: uid(), desc: 'Celular Vo', valor: 99.63, terminaEm: '2027-04', tipo: 'cartao' },
    { id: uid(), desc: 'Passagem Mae', valor: 253.62, terminaEm: '2027-03', tipo: 'cartao' },
    { id: uid(), desc: 'Not Ana', valor: 361.19, terminaEm: '2027-03', tipo: 'cartao' },
    { id: uid(), desc: 'Moveis', valor: 637.83, terminaEm: '2027-02', tipo: 'cartao' },
  ],
  notas: '',
};

const STORAGE_KEY = 'financas_familia_v2';
const loadData = () => { try { const raw = localStorage.getItem(STORAGE_KEY); if (!raw) return DEFAULT_DATA; return JSON.parse(raw); } catch { return DEFAULT_DATA; } };
const saveData = (d) => { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(d)); } catch {} };

function Badge({ tipo }) {
  if (tipo === 'cartao') return React.createElement('span', {className: 'text-xs font-semibold px-2 py-0.5 rounded-full bg-violet-100 text-violet-700'}, 'Cartao');
  if (tipo === 'pix') return React.createElement('span', {className: 'text-xs font-semibold px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-700'}, 'PIX');
  return null;
}

function InputMoney({ value, onChange, className = '' }) {
  const [raw, setRaw] = useState(value === 0 ? '' : String(value).replace('.', ','));
  useEffect(() => { setRaw(value === 0 ? '' : String(value).replace('.', ',')); }, [value]);
  return React.createElement('input', {
    type: 'text', inputMode: 'decimal',
    className: `border border-slate-300 rounded-lg px-3 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400 w-full ${className}`,
    value: raw, placeholder: '0,00',
    onChange: (e) => { const v = e.target.value.replace(/[^0-9,.]/g, ''); setRaw(v); onChange(parseNum(v)); }
  });
}

function SectionHeader({ color, title, total, children }) {
  const colors = { red: 'from-red-500 to-red-600', orange: 'from-orange-500 to-orange-600', blue: 'from-blue-500 to-blue-600', purple: 'from-purple-500 to-purple-600', green: 'from-green-500 to-green-600', pink: 'from-pink-500 to-pink-600', teal: 'from-teal-500 to-teal-600' };
  return React.createElement('div', {className: 'bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden'},
    React.createElement('div', {className: `bg-gradient-to-r ${colors[color]} px-5 py-3 flex items-center justify-between`},
      React.createElement('h2', {className: 'text-white font-bold text-lg'}, title),
      total !== undefined && React.createElement('span', {className: 'bg-white/20 text-white font-mono font-bold text-sm px-3 py-1 rounded-full'}, fmt(total))
    ),
    React.createElement('div', {className: 'p-4'}, children)
  );
}

function ItemRow({ item, onUpdate, onDelete, showTipo = true, showTermina = false }) {
  return React.createElement('div', {className: 'flex items-center gap-2 py-2 border-b border-slate-100 last:border-0 group'},
    React.createElement('input', {
      className: 'border border-slate-300 rounded-lg px-2 py-1.5 text-sm flex-1 min-w-0 focus:outline-none focus:ring-2 focus:ring-blue-400',
      value: item.desc, onChange: (e) => onUpdate({ ...item, desc: e.target.value }), placeholder: 'Descricao'
    }),
    React.createElement('div', {className: 'w-28 shrink-0'},
      React.createElement(InputMoney, {value: item.valor, onChange: (v) => onUpdate({ ...item, valor: v })})
    ),
    showTipo && React.createElement('select', {
      className: 'border border-slate-300 rounded-lg px-2 py-1.5 text-xs focus:outline-none focus:ring-2 focus:ring-blue-400 shrink-0',
      value: item.tipo || 'cartao', onChange: (e) => onUpdate({ ...item, tipo: e.target.value })
    },
      React.createElement('option', {value: 'cartao'}, 'Cartao'),
      React.createElement('option', {value: 'pix'}, 'PIX')
    ),
    showTermina && React.createElement('input', {
      type: 'month', className: 'border border-slate-300 rounded-lg px-2 py-1.5 text-xs focus:outline-none focus:ring-2 focus:ring-blue-400 shrink-0',
      value: item.terminaEm || '', onChange: (e) => onUpdate({ ...item, terminaEm: e.target.value }), title: 'Termina em'
    }),
    React.createElement('button', {
      onClick: onDelete, className: 'text-slate-300 hover:text-red-500 transition-colors shrink-0 opacity-0 group-hover:opacity-100', title: 'Remover'
    }, 'x')
  );
}

function AddButton({ onClick, label = 'Adicionar' }) {
  return React.createElement('button', {
    onClick, className: 'mt-2 w-full border-2 border-dashed border-slate-300 rounded-lg py-2 text-sm text-slate-400 hover:border-blue-400 hover:text-blue-500 transition-colors font-medium'
  }, '+ ' + label);
}

function Card({ color, label, value, sub }) {
  const colors = { blue: 'from-blue-500 to-blue-600', violet: 'from-violet-500 to-violet-600', emerald: 'from-emerald-500 to-emerald-600', green: 'from-green-500 to-green-600', red: 'from-red-500 to-red-600' };
  return React.createElement('div', {className: `bg-gradient-to-br ${colors[color] || colors.blue} rounded-2xl p-4 text-white shadow-sm`},
    React.createElement('div', {className: 'text-xs font-medium opacity-80 mb-1'}, label),
    React.createElement('div', {className: 'font-bold text-xl leading-tight'}, value),
    sub && React.createElement('div', {className: 'text-xs opacity-70 mt-1'}, sub)
  );
}

function Row({ label, value }) {
  return React.createElement('div', {className: 'flex justify-between text-slate-600'},
    React.createElement('span', null, label),
    React.createElement('span', {className: 'font-mono font-medium text-slate-800'}, value)
  );
}

function LabeledInput({ label, value, onChange, hint, negative }) {
  return React.createElement('div', null,
    React.createElement('label', {className: `block text-xs font-semibold mb-1 ${negative ? 'text-red-500' : 'text-slate-600'}`}, (negative ? '- ' : '') + label),
    React.createElement(InputMoney, {value, onChange, className: negative ? 'border-red-300 focus:ring-red-400' : ''}),
    hint && React.createElement('p', {className: 'text-xs text-slate-400 mt-1'}, hint)
  );
}

function App() {
  const [data, setData] = useState(loadData);
  const [activeTab, setActiveTab] = useState('dashboard');
  const [showReset, setShowReset] = useState(false);

  useEffect(() => { saveData(data); }, [data]);

  const update = useCallback((key, val) => setData(prev => ({ ...prev, [key]: val })), []);
  const updateSal = useCallback((field, val) => setData(prev => ({ ...prev, salarios: { ...prev.salarios, [field]: val } })), []);
  const updateList = useCallback((key, id, item) => setData(prev => ({ ...prev, [key]: prev[key].map(i => i.id === id ? item : i) })), []);
  const delFromList = useCallback((key, id) => setData(prev => ({ ...prev, [key]: prev[key].filter(i => i.id !== id) })), []);
  const addToList = useCallback((key, extra = {}) => setData(prev => ({ ...prev, [key]: [...prev[key], { id: uid(), desc: '', valor: 0, tipo: 'cartao', ...extra }] })), []);

  const calc = useMemo(() => {
    const { salarios, fixo, obrigatorio, extras, assinaturas, parceladas } = data;
    const totalSal = salarios.nicolas + salarios.ana + salarios.valeAlimentacao;
    const sum = (arr, tipo) => arr.filter(i => !tipo || i.tipo === tipo).reduce((a, i) => a + parseNum(i.valor), 0);
    const totalAss = sum(assinaturas);
    const totalParcCartao = sum(parceladas, 'cartao');
    const totalParcPix = sum(parceladas, 'pix');
    const totalParc = totalParcCartao + totalParcPix;
    const fixoC = sum(fixo, 'cartao'), fixoP = sum(fixo, 'pix');
    const obrigC = sum(obrigatorio, 'cartao'), obrigP = sum(obrigatorio, 'pix');
    const extC = sum(extras, 'cartao'), extP = sum(extras, 'pix');
    const totalCartao = fixoC + obrigC + extC + totalAss + totalParcCartao;
    const totalPix = fixoP + obrigP + extP + totalParcPix;
    const salLiq = totalSal - salarios.emprestimosDescontados;
    const restaPix = salLiq - totalPix;
    const restaFinal = restaPix - totalCartao;
    return { totalSal, salLiq, fixoC, fixoP, fixo: fixoC+fixoP, obrigC, obrigP, obrig: obrigC+obrigP, extC, extP, ext: extC+extP, totalAss, totalParc, totalParcCartao, totalParcPix, totalCartao, totalPix, restaPix, restaFinal };
  }, [data]);

  const tabs = [
    { id: 'dashboard', label: 'Resumo' },
    { id: 'salarios', label: 'Salarios' },
    { id: 'fixo', label: 'Fixo' },
    { id: 'obrigatorio', label: 'Obrigatorio' },
    { id: 'extras', label: 'Extras' },
    { id: 'assinaturas', label: 'Assinaturas' },
    { id: 'parceladas', label: 'Parceladas' },
    { id: 'notas', label: 'Notas' },
  ];

  const dashSection = activeTab === 'dashboard' && React.createElement('div', {className: 'space-y-4'},
    React.createElement('div', {className: 'grid grid-cols-2 md:grid-cols-4 gap-4'},
      React.createElement(Card, {color:'blue', label:'Total Salarios', value:fmt(calc.totalSal), sub:`Liquido: ${fmt(calc.salLiq)}`}),
      React.createElement(Card, {color:'violet', label:'Cartao de Credito', value:fmt(calc.totalCartao), sub:'Total a pagar no cartao'}),
      React.createElement(Card, {color:'emerald', label:'PIX', value:fmt(calc.totalPix), sub:'Total a pagar via PIX'}),
      React.createElement(Card, {color: calc.restaFinal >= 0 ? 'green' : 'red', label:'Saldo Final', value:fmt(calc.restaFinal), sub:'Apos todas as despesas'})
    ),
    React.createElement('div', {className: 'grid md:grid-cols-2 gap-4'},
      React.createElement(SectionHeader, {color:'purple', title:'Resumo do Cartao'},
        React.createElement('div', {className:'space-y-2 text-sm'},
          React.createElement(Row, {label:'Fixos (cartao)', value:fmt(calc.fixoC)}),
          React.createElement(Row, {label:'Obrigatorios (cartao)', value:fmt(calc.obrigC)}),
          React.createElement(Row, {label:'Extras (cartao)', value:fmt(calc.extC)}),
          React.createElement(Row, {label:'Assinaturas Conjuntas', value:fmt(calc.totalAss)}),
          React.createElement(Row, {label:'Parceladas (cartao)', value:fmt(calc.totalParcCartao)}),
          React.createElement('div', {className:'border-t pt-2 flex justify-between font-bold text-violet-700'},
            React.createElement('span', null, 'TOTAL CARTAO'),
            React.createElement('span', null, fmt(calc.totalCartao))
          ),
          React.createElement('div', {className:'bg-violet-50 rounded-xl p-3 mt-2'},
            React.createElement('div', {className:'text-xs text-violet-500 font-medium mb-1'}, 'Preciso reservar do salario para o cartao:'),
            React.createElement('div', {className:'text-violet-800 font-bold text-xl'}, fmt(calc.restaPix)),
            React.createElement('div', {className:'text-xs text-violet-400'}, '(Salario liquido menos PIX = disponivel para cartao)')
          )
        )
      ),
      React.createElement(SectionHeader, {color:'green', title:'Resumo do PIX'},
        React.createElement('div', {className:'space-y-2 text-sm'},
          React.createElement(Row, {label:'Fixos (PIX)', value:fmt(calc.fixoP)}),
          React.createElement(Row, {label:'Obrigatorios (PIX)', value:fmt(calc.obrigP)}),
          React.createElement(Row, {label:'Extras (PIX)', value:fmt(calc.extP)}),
          React.createElement(Row, {label:'Parceladas (PIX)', value:fmt(calc.totalParcPix)}),
          React.createElement('div', {className:'border-t pt-2 flex justify-between font-bold text-emerald-700'},
            React.createElement('span', null, 'TOTAL PIX'),
            React.createElement('span', null, fmt(calc.totalPix))
          ),
          React.createElement('div', {className:'bg-emerald-50 rounded-xl p-3 mt-2'},
            React.createElement('div', {className:'text-xs text-emerald-500 font-medium mb-1'}, 'Salario restante apos pagar PIX:'),
            React.createElement('div', {className:'text-emerald-800 font-bold text-xl'}, fmt(calc.restaPix)),
            React.createElement('div', {className:'text-xs text-emerald-400'}, '(Este valor deve cobrir o cartao de credito)')
          )
        )
      )
    ),
    React.createElement(SectionHeader, {color:'blue', title:'Composicao dos Salarios'},
      React.createElement('div', {className:'grid md:grid-cols-4 gap-3 text-sm'},
        React.createElement('div', {className:'bg-blue-50 rounded-xl p-3'},
          React.createElement('div', {className:'text-xs text-blue-500 font-medium'}, 'Salario Nicolas'),
          React.createElement('div', {className:'font-bold text-blue-800 text-lg'}, fmt(data.salarios.nicolas))
        ),
        React.createElement('div', {className:'bg-pink-50 rounded-xl p-3'},
          React.createElement('div', {className:'text-xs text-pink-500 font-medium'}, 'Salario Ana'),
          React.createElement('div', {className:'font-bold text-pink-800 text-lg'}, fmt(data.salarios.ana))
        ),
        React.createElement('div', {className:'bg-amber-50 rounded-xl p-3'},
          React.createElement('div', {className:'text-xs text-amber-500 font-medium'}, 'Vale Alimentacao'),
          React.createElement('div', {className:'font-bold text-amber-800 text-lg'}, fmt(data.salarios.valeAlimentacao))
        ),
        React.createElement('div', {className:'bg-red-50 rounded-xl p-3'},
          React.createElement('div', {className:'text-xs text-red-500 font-medium'}, '- Emprestimos (fonte)'),
          React.createElement('div', {className:'font-bold text-red-700 text-lg'}, fmt(data.salarios.emprestimosDescontados))
        )
      )
    ),
    data.parceladas.length > 0 && React.createElement(SectionHeader, {color:'orange', title:'Parceladas Ativas'},
      React.createElement('div', {className:'overflow-x-auto'},
        React.createElement('table', {className:'w-full text-sm'},
          React.createElement('thead', null,
            React.createElement('tr', {className:'text-slate-500 text-xs border-b'},
              React.createElement('th', {className:'text-left py-2 font-semibold'}, 'Descricao'),
              React.createElement('th', {className:'text-right py-2 font-semibold'}, 'Valor/mes'),
              React.createElement('th', {className:'text-center py-2 font-semibold'}, 'Termina em'),
              React.createElement('th', {className:'text-center py-2 font-semibold'}, 'Metodo')
            )
          ),
          React.createElement('tbody', null, data.parceladas.map(p => {
            const now = new Date();
            const end = p.terminaEm ? new Date(p.terminaEm + '-01') : null;
            const soon = end && (end - now) < 90 * 24 * 60 * 60 * 1000;
            return React.createElement('tr', {key: p.id, className: `border-b border-slate-100 ${soon ? 'bg-yellow-50' : ''}`},
              React.createElement('td', {className:'py-2'}, p.desc || 'sem nome'),
              React.createElement('td', {className:'py-2 text-right font-mono font-medium'}, fmt(p.valor)),
              React.createElement('td', {className:'py-2 text-center'},
                p.terminaEm ? React.createElement('span', {className: `text-xs px-2 py-0.5 rounded-full ${soon ? 'bg-yellow-200 text-yellow-800' : 'bg-slate-100 text-slate-600'}`},
                  new Date(p.terminaEm + '-02').toLocaleDateString('pt-BR', { month: 'short', year: 'numeric' })
                ) : '-'
              ),
              React.createElement('td', {className:'py-2 text-center'}, React.createElement(Badge, {tipo: p.tipo}))
            );
          })),
          React.createElement('tfoot', null,
            React.createElement('tr', {className:'font-bold text-slate-700'},
              React.createElement('td', {className:'pt-2'}, 'Total'),
              React.createElement('td', {className:'pt-2 text-right font-mono'}, fmt(calc.totalParc)),
              React.createElement('td', {colSpan:2})
            )
          )
        )
      )
    )
  );

  return React.createElement('div', {className:'min-h-screen bg-slate-100'},
    React.createElement('header', {className:'bg-gradient-to-r from-slate-800 to-slate-900 shadow-lg sticky top-0 z-50'},
      React.createElement('div', {className:'max-w-5xl mx-auto px-4 py-3 flex items-center justify-between'},
        React.createElement('div', null,
          React.createElement('h1', {className:'text-white font-bold text-xl'}, 'Financas da Familia'),
          React.createElement('p', {className:'text-slate-400 text-xs'}, 'Controle mensal de gastos')
        ),
        React.createElement('div', {className:'flex items-center gap-3'},
          React.createElement('div', {className:'text-right hidden sm:block'},
            React.createElement('div', {className:'text-xs text-slate-400'}, 'Saldo Final'),
            React.createElement('div', {className:`font-bold text-lg ${calc.restaFinal >= 0 ? 'text-emerald-400' : 'text-red-400'}`}, fmt(calc.restaFinal))
          ),
          React.createElement('button', {
            onClick:() => setShowReset(true),
            className:'no-print text-xs text-slate-500 hover:text-red-400 border border-slate-600 hover:border-red-500 px-2 py-1 rounded transition-colors'
          }, 'Reset')
        )
      ),
      React.createElement('div', {className:'max-w-5xl mx-auto px-4 flex gap-1 overflow-x-auto pb-1 scrollbar-thin'},
        tabs.map(t => React.createElement('button', {
          key:t.id, onClick:() => setActiveTab(t.id),
          className:`whitespace-nowrap px-3 py-1.5 rounded-t-lg text-sm font-medium transition-colors no-print ${activeTab===t.id ? 'bg-white text-slate-800' : 'text-slate-400 hover:text-white'}`
        }, t.label))
      )
    ),

    React.createElement('main', {className:'max-w-5xl mx-auto px-4 py-6 space-y-6'},
      dashSection,

      activeTab === 'salarios' && React.createElement(SectionHeader, {color:'blue', title:'Salarios e Renda', total:calc.totalSal},
        React.createElement('div', {className:'grid md:grid-cols-2 gap-6'},
          React.createElement('div', {className:'space-y-3'},
            React.createElement('h3', {className:'font-semibold text-slate-700 text-sm border-b pb-2'}, 'Entradas'),
            React.createElement(LabeledInput, {label:'Salario Nicolas', value:data.salarios.nicolas, onChange:(v)=>updateSal('nicolas',v)}),
            React.createElement(LabeledInput, {label:'Salario Ana (liquido)', value:data.salarios.ana, onChange:(v)=>updateSal('ana',v)}),
            React.createElement(LabeledInput, {label:'Vale Alimentacao', value:data.salarios.valeAlimentacao, onChange:(v)=>updateSal('valeAlimentacao',v)})
          ),
          React.createElement('div', {className:'space-y-3'},
            React.createElement('h3', {className:'font-semibold text-red-600 text-sm border-b pb-2'}, 'Deducoes automaticas'),
            React.createElement(LabeledInput, {label:'Emprestimos descontados na fonte', value:data.salarios.emprestimosDescontados, onChange:(v)=>updateSal('emprestimosDescontados',v), hint:'Ex: financiamento de moveis ja descontado do salario', negative:true})
          )
        ),
        React.createElement('div', {className:'mt-4 grid grid-cols-2 gap-3'},
          React.createElement('div', {className:'bg-blue-50 rounded-xl p-3 text-center'},
            React.createElement('div', {className:'text-xs text-blue-500'}, 'Total Bruto'),
            React.createElement('div', {className:'font-bold text-blue-800'}, fmt(calc.totalSal))
          ),
          React.createElement('div', {className:'bg-emerald-50 rounded-xl p-3 text-center'},
            React.createElement('div', {className:'text-xs text-emerald-500'}, 'Salario Liquido'),
            React.createElement('div', {className:'font-bold text-emerald-800'}, fmt(calc.salLiq))
          )
        )
      ),

      activeTab === 'fixo' && React.createElement(SectionHeader, {color:'red', title:'Gastos Fixos', total:calc.fixo},
        React.createElement('p', {className:'text-xs text-slate-500 mb-3'}, 'Despesas recorrentes todo mes. Marque se e PIX ou Cartao.'),
        data.fixo.map(item => React.createElement(ItemRow, {key:item.id, item, showTipo:true,
          onUpdate:(it)=>updateList('fixo',item.id,it), onDelete:()=>delFromList('fixo',item.id)})),
        React.createElement(AddButton, {onClick:()=>addToList('fixo',{tipo:'pix'}), label:'Adicionar gasto fixo'}),
        React.createElement('div', {className:'mt-3 grid grid-cols-2 gap-3'},
          React.createElement('div', {className:'bg-emerald-50 rounded-xl p-2 text-center text-sm'},
            React.createElement('div', {className:'text-xs text-emerald-500'}, 'PIX'),
            React.createElement('div', {className:'font-bold text-emerald-700'}, fmt(calc.fixoP))
          ),
          React.createElement('div', {className:'bg-violet-50 rounded-xl p-2 text-center text-sm'},
            React.createElement('div', {className:'text-xs text-violet-500'}, 'Cartao'),
            React.createElement('div', {className:'font-bold text-violet-700'}, fmt(calc.fixoC))
          )
        )
      ),

      activeTab === 'obrigatorio' && React.createElement(SectionHeader, {color:'orange', title:'Gastos Obrigatorios', total:calc.obrig},
        React.createElement('p', {className:'text-xs text-slate-500 mb-3'}, 'Mercado, farmacia, combustivel. Valores estimados mensais.'),
        data.obrigatorio.map(item => React.createElement(ItemRow, {key:item.id, item, showTipo:true,
          onUpdate:(it)=>updateList('obrigatorio',item.id,it), onDelete:()=>delFromList('obrigatorio',item.id)})),
        React.createElement(AddButton, {onClick:()=>addToList('obrigatorio',{tipo:'cartao'}), label:'Adicionar gasto obrigatorio'}),
        React.createElement('div', {className:'mt-3 grid grid-cols-2 gap-3'},
          React.createElement('div', {className:'bg-emerald-50 rounded-xl p-2 text-center text-sm'},
            React.createElement('div', {className:'text-xs text-emerald-500'}, 'PIX'),
            React.createElement('div', {className:'font-bold text-emerald-700'}, fmt(calc.obrigP))
          ),
          React.createElement('div', {className:'bg-violet-50 rounded-xl p-2 text-center text-sm'},
            React.createElement('div', {className:'text-xs text-violet-500'}, 'Cartao'),
            React.createElement('div', {className:'font-bold text-violet-700'}, fmt(calc.obrigC))
          )
        )
      ),

      activeTab === 'extras' && React.createElement(SectionHeader, {color:'blue', title:'Extras / Lazer', total:calc.ext},
        React.createElement('p', {className:'text-xs text-slate-500 mb-3'}, 'Gastos com lazer, compras extras, etc.'),
        data.extras.map(item => React.createElement(ItemRow, {key:item.id, item, showTipo:true,
          onUpdate:(it)=>updateList('extras',item.id,it), onDelete:()=>delFromList('extras',item.id)})),
        React.createElement(AddButton, {onClick:()=>addToList('extras',{tipo:'cartao'}), label:'Adicionar extra'}),
        React.createElement('div', {className:'mt-3 grid grid-cols-2 gap-3'},
          React.createElement('div', {className:'bg-emerald-50 rounded-xl p-2 text-center text-sm'},
            React.createElement('div', {className:'text-xs text-emerald-500'}, 'PIX'),
            React.createElement('div', {className:'font-bold text-emerald-700'}, fmt(calc.extP))
          ),
          React.createElement('div', {className:'bg-violet-50 rounded-xl p-2 text-center text-sm'},
            React.createElement('div', {className:'text-xs text-violet-500'}, 'Cartao'),
            React.createElement('div', {className:'font-bold text-violet-700'}, fmt(calc.extC))
          )
        )
      ),

      activeTab === 'assinaturas' && React.createElement(SectionHeader, {color:'pink', title:'Assinaturas Conjuntas', total:calc.totalAss},
        React.createElement('p', {className:'text-xs text-slate-500 mb-3'}, 'Streaming, internet, apps - todos debitados no cartao conjunto.'),
        data.assinaturas.map(item => React.createElement(ItemRow, {key:item.id, item, showTipo:false,
          onUpdate:(it)=>updateList('assinaturas',item.id,it), onDelete:()=>delFromList('assinaturas',item.id)})),
        React.createElement(AddButton, {onClick:()=>addToList('assinaturas',{}), label:'Adicionar assinatura'})
      ),

      activeTab === 'parceladas' && React.createElement(SectionHeader, {color:'teal', title:'Parceladas', total:calc.totalParc},
        React.createElement('p', {className:'text-xs text-slate-500 mb-3'}, 'Compras parceladas. Amarelo = encerra em menos de 3 meses.'),
        data.parceladas.map(item => {
          const now = new Date(), end = item.terminaEm ? new Date(item.terminaEm+'-01') : null;
          const soon = end && (end-now) < 90*24*60*60*1000;
          return React.createElement('div', {key:item.id, className:`rounded-lg ${soon?'bg-yellow-50 -mx-1 px-1':''}`},
            React.createElement(ItemRow, {item, showTipo:true, showTermina:true,
              onUpdate:(it)=>updateList('parceladas',item.id,it), onDelete:()=>delFromList('parceladas',item.id)})
          );
        }),
        React.createElement(AddButton, {onClick:()=>addToList('parceladas',{terminaEm:'',tipo:'cartao'}), label:'Adicionar parcela'})
      ),

      activeTab === 'notas' && React.createElement(SectionHeader, {color:'green', title:'Notas e Observacoes'},
        React.createElement('textarea', {
          className:'w-full border border-slate-300 rounded-xl p-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400 resize-none',
          rows:14, placeholder:'Anotacoes livres, lembretes, observacoes sobre o mes...',
          value:data.notas||'', onChange:(e)=>update('notas',e.target.value)
        })
      )
    ),

    showReset && React.createElement('div', {className:'fixed inset-0 bg-black/50 flex items-center justify-center z-50'},
      React.createElement('div', {className:'bg-white rounded-2xl p-6 shadow-2xl max-w-sm mx-4'},
        React.createElement('h3', {className:'font-bold text-lg text-slate-800 mb-2'}, 'Resetar dados?'),
        React.createElement('p', {className:'text-slate-600 text-sm mb-4'}, 'Isso vai apagar todos os dados e restaurar os valores de exemplo. Essa acao nao pode ser desfeita.'),
        React.createElement('div', {className:'flex gap-3'},
          React.createElement('button', {onClick:()=>setShowReset(false), className:'flex-1 border border-slate-300 rounded-xl py-2 text-sm font-medium hover:bg-slate-50 transition-colors'}, 'Cancelar'),
          React.createElement('button', {onClick:()=>{setData(DEFAULT_DATA);setShowReset(false);}, className:'flex-1 bg-red-500 text-white rounded-xl py-2 text-sm font-medium hover:bg-red-600 transition-colors'}, 'Resetar')
        )
      )
    ),

    React.createElement('footer', {className:'max-w-5xl mx-auto px-4 py-4 text-center text-xs text-slate-400'},
      'Dados salvos localmente no seu navegador. Nenhuma informacao e enviada para servidores.'
    )
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(React.createElement(App));
</script>
</body>
</html>
